[tools]
zig = "0.16.0"

[tasks.setup]
description = "Fetch the pinned zlint source into vendor/zlint"
run = "scripts/fetch-zlint.sh"

[tasks.test]
description = "Run custom rule tests and lint this repository"
run = "zig build test"

[tasks.lint]
description = "Run gdzig-zlint on this repository"
run = "zig build lint"

[tasks.build]
description = "Build the gdzig-zlint binary"
run = "zig build -Doptimize=ReleaseFast"
